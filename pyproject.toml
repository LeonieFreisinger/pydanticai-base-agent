[project]
name = "sql-agent-showcase"
version = "1.0.0"
description = "SQL Query Agent showcase for pydantic-ai lecture"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Core pydantic-ai with provider support
    "pydantic-ai[openai,anthropic,google]>=0.1.0",
    
    # Chat interface
    "chainlit>=1.0.0",
    
    # Async SQLite
    "aiosqlite>=0.19.0",
    
    # Environment management
    "python-dotenv>=1.0.0",
    
    # Observability (optional, for Langfuse)
    "logfire[pydantic-ai]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]  # Line length handled separately

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
